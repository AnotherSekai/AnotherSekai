name: Build latest snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snapshot-latest
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build latest snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portable distribution
        run: bun run build

      - name: Create snapshot archive
        run: tar -C dist -czf "AnotherSekai.tar.gz" .

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnotherSekai-${{ github.sha }}
          path: AnotherSekai.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Move snapshot tag to this commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git tag --force snapshot-latest "$COMMIT_SHA"
          git push --force origin refs/tags/snapshot-latest

      - name: Publish snapshot release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot-latest
          target_commitish: ${{ github.sha }}
          name: Latest snapshot
          body: |
            Latest automated snapshot build.

            Commit: ${{ github.sha }}
          prerelease: true
          files: AnotherSekai.tar.gz
          overwrite_files: true
          fail_on_unmatched_files: true
